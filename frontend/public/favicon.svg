<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle (Solid Pure Black) -->
  <circle cx="256" cy="256" r="248" fill="#000000" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="22" />
  
  <!-- 'N' Glyph -->
  <text 
    x="256" 
    y="262" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="208" 
    font-weight="900"
    letter-spacing="-2"
  >N</text>
  
  <!-- Divider Line -->
  <line x1="144" y1="288" x2="368" y2="288" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  
  <!-- 'ATS' Subtext -->
  <text 
    x="262" 
    y="370" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="72" 
    font-weight="800" 
    letter-spacing="14"
  >ATS</text>
</svg>
